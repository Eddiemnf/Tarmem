
# Builds the site in web/ and publishes it to GitHub Pages on every push to main.
#
# One-time setup: repository Settings → Pages → Build and deployment →
# Source: "GitHub Actions". After that this runs on its own.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          # Playwright is only used by the local smoke test; CI needs no browser.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Type-check and build
        run: npm run build
        env:
          # Pages serves this repo under /Tarmem/; every other host uses the root.
          BASE_PATH: /Tarmem/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
